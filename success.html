<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement confirmé — H12 Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .success-wrap { min-height: 80vh; display: grid; place-items: center; padding: 40px 20px; }
    .success-card { max-width: 480px; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 32px; }
    .success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(52, 211, 153, 0.15); color: var(--success); display: grid; place-items: center; font-size: 1.8rem; margin: 0 auto 20px; }
    .success-card h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 12px; }
    .success-card p { color: var(--text-muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="logo">
        <span class="logo-mark">H12</span>
        <span class="logo-text">Digital</span>
      </a>
    </div>
  </header>
  <div class="success-wrap">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h1>Paiement confirmé</h1>
      <p>Merci. Ton accès est en cours de préparation. Tu recevras un email avec les liens de téléchargement / accès sous peu (vérifie aussi tes spams).</p>
      <a href="/" class="btn btn-primary">Retour à la boutique</a>
    </div>
  </div>
</body>
</html>
